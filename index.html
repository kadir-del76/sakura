<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/splash-750x1334.png">
<title>Sakura</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#E9E8E3;--surface:#F8F7F4;--ink:#16181D;--muted:#5F636B;--line:#D6D4CD;
  --act:#1E2A44;--act-ink:#FFFFFF;--soft:#E1E4EB;--sakura:#C9879A;--warn:#B23A3A;
  --body:Saira,"Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Saira Condensed","Arial Narrow","Roboto Condensed",Arial,sans-serif;
  --jp:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#111317;--surface:#1A1D23;--ink:#ECEBE6;--muted:#9A9EA6;--line:#2A2E36;--act:#ECEBE6;--act-ink:#111317;--soft:#252A35;--sakura:#D99AAB;--warn:#E07A7A}
}
:root[data-theme="dark"]{--bg:#111317;--surface:#1A1D23;--ink:#ECEBE6;--muted:#9A9EA6;--line:#2A2E36;--act:#ECEBE6;--act-ink:#111317;--soft:#252A35;--sakura:#D99AAB;--warn:#E07A7A}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}   /* ausgeblendet heißt immer ausgeblendet, auch bei Flex-Elementen */
html{scroll-padding-top:env(safe-area-inset-top,0px);touch-action:manipulation;-webkit-text-size-adjust:100%}
/* Kein Doppeltipp-Zoom: Schnelles Tippen auf + und − soll nur zählen, nicht vergrößern. */
button,.chip,.ctrl,.switch{touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--act);outline-offset:2px}

/* ---------- Einstellungsseite ---------- */
main{max-width:70rem;margin:0 auto;padding:1.25rem 1rem 8rem}
.brand{display:flex;align-items:center;gap:.65rem;margin:.5rem 0 1.75rem}
.brand svg{width:3.6rem;height:3.6rem;flex:none;color:var(--ink)}
.brand h1{margin:0;font-family:var(--body);font-style:italic;font-weight:800;font-size:2.2rem;line-height:1;letter-spacing:.03em}
.brand p{margin:.15rem 0 0;color:var(--muted);font-size:.95rem}
.layout{display:grid;gap:1.25rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:56rem){.layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.col{display:grid;gap:1.25rem;grid-template-columns:minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.1rem 1.2rem}
.card h2{margin:0 0 .9rem;font-family:var(--cond);font-weight:700;font-size:1.45rem;line-height:1.1;display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
.card h2 small{font-family:var(--body);font-weight:500;font-size:.95rem;color:var(--muted)}

.step{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.step:last-of-type{border-bottom:0}
.step .lbl{font-weight:500}
.ctrl{display:flex;align-items:center;gap:.35rem}
.ctrl button{width:2.75rem;height:2.75rem;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:1.4rem;line-height:1;display:grid;place-items:center}
.ctrl button:active{background:var(--soft)}
.ctrl .val{width:5.2rem;text-align:center;font-family:var(--cond);font-weight:700;font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1.1;
  color:var(--ink);background:transparent;border:0;border-bottom:2px dashed var(--line);border-radius:0;padding:.1rem 0;cursor:text}
.ctrl .val:hover{border-bottom-color:var(--muted)}
.ctrl .val:focus{outline:none;border-bottom:2px solid var(--act);background:var(--bg)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding-top:.75rem;font-weight:500}
.voicerow{display:flex;align-items:center;gap:.5rem;padding-top:.75rem;font-weight:500}
.voicerow label{flex:none}
.voicerow select{flex:1;min-width:0;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.5rem .6rem}
.switch input{appearance:none;width:3rem;height:1.75rem;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.35rem;height:1.35rem;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked{background:var(--act)}
.switch input:checked::after{transform:translateX(1.25rem)}

.entry{display:flex;gap:.5rem}
.entry input{flex:1;min-width:0;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.7rem .85rem}
.entry input:focus{border-color:var(--act);outline:none;box-shadow:0 0 0 3px var(--soft)}
.btn{border:0;border-radius:10px;padding:.7rem 1.1rem;font-weight:600;background:var(--bg);border:1px solid var(--line)}
.btn.primary{background:var(--act);border-color:var(--act);color:var(--act-ink)}
.msg{min-height:1.3em;margin:.4rem 0 .6rem;font-size:.92rem;color:var(--warn)}
.msg.ok{color:var(--ink)}
.rtools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem;margin:0 0 .7rem}
.rhint{color:var(--muted);font-size:.92rem}
.rbtns{display:flex;gap:.35rem}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:.35rem .8rem;font-weight:600;font-size:.9rem;min-height:2.2rem}
.mini[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.45rem}
.chips li{display:flex}
.chip{display:flex;align-items:center;gap:.35rem;min-height:2.6rem;padding:0 .9rem;border-radius:999px;font-weight:500;
  border:1.5px dashed var(--line);background:transparent;color:var(--muted)}
.chip svg{width:1rem;height:1rem;flex:none}
.chip[aria-pressed="true"]{border:1.5px solid var(--act);background:var(--act);color:var(--act-ink)}
.chip.editing{border-style:solid;background:var(--bg);color:var(--ink);padding-right:.3rem}
.chip .x{display:grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;color:var(--warn);font-size:1.2rem;line-height:1}
.chips .none{color:var(--muted)}
.hint{margin:.9rem 0 0;font-size:.92rem;color:var(--muted)}
.hint.warn{color:var(--warn)}

.pv-head{display:flex;align-items:center;gap:.6rem;margin:.25rem 0 .4rem}
.pv-head h2{margin:0;flex:1;font-family:var(--cond);font-weight:800;font-size:2rem;line-height:1}
.rbtn{width:2.75rem;height:2.75rem;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.rbtn svg{width:1.25rem;height:1.25rem}
.pill{height:2.75rem;padding:0 .95rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:flex;align-items:center;gap:.45rem}
.pill svg{width:1.1rem;height:1.1rem}
.pv-sum{margin:0 0 1rem;color:var(--muted)}
.pv-sum.warn{color:var(--warn)}
.rounds{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr))}
.round{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.75rem 1rem}
.round h3{margin:0 0 .25rem;font-family:var(--cond);font-weight:800;font-size:1.25rem;color:var(--ink)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:.5rem;align-items:center;padding:.3rem 0;font-weight:500}
.pair span:last-child{text-align:right}
.pair .vs{font-size:.75rem;color:var(--muted);font-weight:500}
.pair.repeat{color:var(--warn)}
.bye{margin-top:.35rem;text-align:center;font-size:.82rem;color:var(--muted)}
.empty{color:var(--muted);margin:0}

.dock{position:fixed;left:0;right:0;bottom:0;padding:.75rem 1rem calc(env(safe-area-inset-bottom,0px) + .75rem);
  background:linear-gradient(to top,var(--bg) 70%,transparent)}
.dock button{display:flex;width:100%;max-width:70rem;margin:0 auto;justify-content:space-between;align-items:center;gap:1rem;
  border:0;border-radius:14px;padding:1rem 1.25rem;background:var(--act);color:var(--act-ink);text-align:left}
.dock button:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.dock strong{font-family:var(--cond);font-weight:800;font-size:1.5rem;line-height:1;letter-spacing:.01em;white-space:nowrap}
.dock span{font-weight:500;font-size:.95rem;opacity:.9;text-align:right}

/* ---------- Timer ---------- */
#timer{position:fixed;inset:0;display:none;flex-direction:column;z-index:5;
  --bgc:#8EE08A;--fg:#0F2E17;--chip:rgba(0,0,0,.08);--chipb:rgba(0,0,0,.2);
  background:var(--bgc);color:var(--fg);transition:background-color .35s;
  padding:calc(env(safe-area-inset-top,0px) + .9rem) 1rem calc(env(safe-area-inset-bottom,0px) + 1.1rem)}
#timer.on{display:flex}
#timer.prep{--bgc:#1E2A44;--fg:#FFFFFF;--chip:rgba(255,255,255,.12);--chipb:rgba(255,255,255,.35)}
#timer.pause{--bgc:#D7352B;--fg:#FFFFFF;--chip:rgba(255,255,255,.16);--chipb:rgba(255,255,255,.45)}
#timer.final{--bgc:#F4C430;--fg:#2A2205}
#timer.done{--bgc:#1B1D24;--fg:#FFFFFF;--chip:rgba(255,255,255,.12);--chipb:rgba(255,255,255,.35)}
.tbar{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.tbtns{display:flex;gap:.5rem}
.tpair .gone{text-decoration:line-through;opacity:.5}
.tpair.jump{background:transparent;border:2px dashed var(--fg)}
.tpair span.tag{grid-column:1/-1;text-align:center;font-family:var(--body);font-size:max(.8rem,.42em);font-weight:600;opacity:.8;text-align:center;margin-top:-.1em}
.sheet{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:flex-end}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet-panel{position:relative;background:var(--surface);color:var(--ink);border-radius:18px 18px 0 0;max-height:82%;overflow:auto;
  padding:1.1rem 1rem calc(env(safe-area-inset-bottom,0px) + 1.2rem);width:100%;max-width:44rem;margin:0 auto;font-family:var(--body)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.sheet-head h2{margin:0;font-family:var(--cond);font-weight:800;font-size:1.6rem;display:flex;align-items:baseline;gap:.6rem}
.sheet-head small{font-family:var(--body);font-weight:500;font-size:.95rem;color:var(--muted)}
.sheet-note{margin:.35rem 0 .9rem;color:var(--muted);font-size:.92rem}
.tphase{font-family:var(--cond);font-weight:800;font-size:clamp(1.6rem,5vw,3.2rem);line-height:1;letter-spacing:.01em}
.tphase small{font-weight:600;opacity:.7}
.jp{font-family:var(--jp);font-weight:700;font-size:.8em;opacity:.6;margin-right:.45em}
.ibtn{width:3rem;height:3rem;border-radius:50%;border:1px solid var(--chipb);background:var(--chip);color:inherit;display:grid;place-items:center;flex:none}
.ibtn svg{width:1.35rem;height:1.35rem}
.ibtn:disabled{opacity:.35;cursor:default}
.clock{font-family:var(--cond);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  font-size:calc(clamp(7.5rem,min(36vw,46vh),28rem) * var(--cs,1));line-height:.86;text-align:center;margin:.4rem 0 .5rem}
/* Platzstufen: Uhr (data-c) nur in Countdown und Pause kleiner, Paare (data-p) kompakter und mehrspaltig */
#timer[data-c="1"]{--cs:.72}#timer[data-c="2"]{--cs:.52}#timer[data-c="3"]{--cs:.38}
#timer[data-p="1"]{--pf:.82}#timer[data-p="2"]{--pf:.66}#timer[data-p="3"]{--pf:.52}
.tsub{text-align:center;font-family:var(--cond);font-weight:700;font-size:clamp(1.3rem,4vw,2.3rem);min-height:1.2em;margin-bottom:.7rem;opacity:.9}
.tpairs{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
/* Spaltenbreite in em: wächst und schrumpft mit der Schrift, damit Namen nie in die Nachbarspalte laufen */
.tpin{margin:auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(10.5em,100%),1fr));gap:.3em;padding:2px 0;width:100%;
  font-family:var(--cond);font-weight:700;font-size:calc(clamp(1.45rem,3.8vw,2.4rem) * var(--pf,1));line-height:1.1}
.tpair{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:.4em;padding:.3em .55em;border-radius:12px;
  background:var(--chip)}
.tpair span{min-width:0;overflow-wrap:anywhere}
.tpair span:last-child{text-align:right}
.tpair .vs{font-size:.5em;font-weight:600;opacity:.65}
.tbye{grid-column:1/-1;text-align:center;font-family:var(--body);font-weight:600;font-size:max(.95rem,.62em);opacity:.9}
.tctrl{display:flex;justify-content:center;align-items:center;gap:1rem;margin-top:1rem}
.tctrl .ibtn{width:3.6rem;height:3.6rem;position:relative;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tctrl .ibtn svg{position:relative}
.tctrl .ibtn::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--fg);opacity:.28;transform:scale(0)}
.tctrl .ibtn.holding::before{transform:scale(1);transition:transform .6s linear}
.thint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 6.4rem);transform:translateX(-50%);background:var(--fg);color:var(--bgc);
  padding:.45rem .9rem;border-radius:999px;font-weight:600;font-size:.95rem;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.thint.show{opacity:1}
.tmain{min-width:11rem;height:3.6rem;border-radius:999px;border:0;background:var(--fg);color:var(--bgc);font-family:var(--cond);font-weight:800;font-size:1.45rem;letter-spacing:.02em;padding:0 1.6rem}
.progress{height:6px;border-radius:999px;background:var(--chip);margin-top:1rem;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--fg);opacity:.75}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:10}
#flash.go1{animation:flash .7s ease-out 1}
#flash.go2{animation:flash .55s ease-out 2}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#timer,.switch input,.switch input::after{transition:none}@keyframes flash{0%{opacity:.55}100%{opacity:0}}}
</style>
</head>
<body>
<main>
<div id="setupView">
  <header class="brand">
    <svg class="logo" viewBox="-110 -110 220 220" aria-hidden="true">
      <path d="M-27.0 -37.2C-42.5 -65.4 -46.8 -91.8 -18.9 -97.2L0.0 -85.0L18.9 -97.2C46.8 -91.8 42.5 -65.4 27.0 -37.2C49.1 -60.6 72.8 -72.8 86.6 -48.0L80.8 -26.3L98.3 -12.1C101.7 16.1 75.3 20.2 43.7 14.2C72.8 28.0 91.8 46.8 72.4 67.5L50.0 68.8L41.8 89.7C16.1 101.7 4.1 77.9 0.0 46.0C-4.1 77.9 -16.1 101.7 -41.8 89.7L-50.0 68.8L-72.4 67.5C-91.8 46.8 -72.8 28.0 -43.7 14.2C-75.3 20.2 -101.7 16.1 -98.3 -12.1L-80.8 -26.3L-86.6 -48.0C-72.8 -72.8 -49.1 -60.6 -27.0 -37.2Z" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/>
      <text x="0" y="19" text-anchor="middle" font-family="Noto Serif JP, Hiragino Mincho ProN, Yu Mincho, serif" font-weight="600" font-size="54" fill="currentColor">桜</text>
    </svg>
    <h1>SAKURA</h1>
  </header>

  <div class="layout">
      <section class="card" aria-labelledby="h-set">
        <h2 id="h-set">Session</h2>
        <div class="step"><span class="lbl" id="l-round">Round time</span>
          <div class="ctrl" role="group" aria-labelledby="l-round"><button data-k="round" data-d="-1" aria-label="Shorter rounds">−</button><input class="val" id="o-round" inputmode="decimal" autocomplete="off" enterkeyhint="done" aria-labelledby="l-round"><button data-k="round" data-d="1" aria-label="Longer rounds">+</button></div></div>
        <div class="step"><span class="lbl" id="l-pause">Rest</span>
          <div class="ctrl" role="group" aria-labelledby="l-pause"><button data-k="pause" data-d="-1" aria-label="Shorter rest">−</button><input class="val" id="o-pause" inputmode="decimal" autocomplete="off" enterkeyhint="done" aria-labelledby="l-pause"><button data-k="pause" data-d="1" aria-label="Longer rest">+</button></div></div>
        <div class="step"><span class="lbl" id="l-rounds">Rounds</span>
          <div class="ctrl" role="group" aria-labelledby="l-rounds"><button data-k="rounds" data-d="-1" aria-label="One round fewer">−</button><input class="val" id="o-rounds" inputmode="numeric" autocomplete="off" enterkeyhint="done" aria-labelledby="l-rounds"><button data-k="rounds" data-d="1" aria-label="One round more">+</button></div></div>
        <label class="switch">Bell and beeps <input type="checkbox" id="sound" checked></label>
        <label class="switch" id="speakRow">Read pairings aloud <input type="checkbox" id="speak" checked></label>
        <div class="voicerow" id="voiceRow"><label for="voiceSel">Voice</label><select id="voiceSel"></select><button type="button" class="mini" id="voiceTest">Test</button></div>
      </section>

      <section class="card" aria-labelledby="h-ppl">
        <h2 id="h-ppl">Athletes <small id="count"></small></h2>
        <div class="entry">
          <input id="nameIn" type="text" placeholder="Enter name" autocomplete="off" enterkeyhint="done" aria-label="Enter name">
          <button class="btn primary" id="saveName">Save</button>
        </div>
        <p class="msg" id="msg" aria-live="polite"></p>
        <div class="rtools" id="rtools" hidden>
          <span class="rhint" id="rhint">Tap names to mark who’s here.</span>
          <div class="rbtns"><button class="mini" id="allHere">All</button><button class="mini" id="noneHere">None</button><button class="mini" id="editRoster" aria-pressed="false">Edit</button></div>
        </div>
        <ul class="chips" id="chips" aria-label="Athlete list"></ul>
        <div id="info"></div>
      </section>
  </div>
</div>

<section id="pairView" hidden aria-labelledby="h-pairs">
  <div class="pv-head">
    <button class="rbtn" id="pvBack" aria-label="Back to athletes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2 id="h-pairs">Pairings</h2>
    <button class="pill" id="shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Reshuffle</button>
  </div>
  <p class="pv-sum" id="pvSum"></p>
  <div id="planBody"></div>
</section>
</main>

<div class="dock"><button id="start" disabled><strong id="dockLabel">Create pairings</strong><span id="total"></span></button></div>

<div id="flash" aria-hidden="true"></div>
<div id="timer" role="dialog" aria-modal="true" aria-label="Timer">
  <div class="tbar">
    <div class="tphase" id="tPhase"></div>
    <div class="tbtns">
      <button class="ibtn" id="tPeople" aria-label="Who’s here"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.9-5 5.5-5s4.9 1.8 5.5 5"/><path d="M19 8v6M16 11h6"/></svg></button>
      <button class="ibtn" id="tClose" aria-label="Back to plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
  <div class="clock" id="tClock">0:10</div>
  <div class="tsub" id="tSub"></div>
  <div class="tpairs" id="tPairs"></div>
  <div class="thint" id="tHint" aria-live="polite"></div>
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-bg" id="sheetBg"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="h-sheet">
      <div class="sheet-head"><h2 id="h-sheet">Who’s here <small id="sCount"></small></h2><button class="btn primary" id="sDone">Done</button></div>
      <p class="sheet-note">Changes apply from the next round. The timer keeps running.</p>
      <div class="entry"><input id="sNameIn" type="text" placeholder="Add a late arrival" autocomplete="off" enterkeyhint="done" aria-label="Add a late arrival"><button class="btn primary" id="sSave">Save</button></div>
      <p class="msg" id="sMsg" aria-live="polite"></p>
      <ul class="chips" id="sChips" aria-label="Athlete list"></ul>
    </div>
  </div>
  <div class="tctrl">
    <button class="ibtn" id="tPrev" aria-label="Previous phase"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="tmain" id="tToggle">Pause</button>
    <button class="ibtn" id="tNext" aria-label="Next phase"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  </div>
  <div class="progress" aria-hidden="true"><i id="tProg"></i></div>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const el={sound:$('#sound'),nameIn:$('#nameIn'),saveName:$('#saveName'),msg:$('#msg'),chips:$('#chips'),count:$('#count'),info:$('#info'),
  planBody:$('#planBody'),shuffle:$('#shuffle'),start:$('#start'),total:$('#total'),dockLabel:$('#dockLabel'),pvSum:$('#pvSum'),pvBack:$('#pvBack'),setupView:$('#setupView'),pairView:$('#pairView'),
  timer:$('#timer'),tPhase:$('#tPhase'),tClock:$('#tClock'),tSub:$('#tSub'),tPairs:$('#tPairs'),tToggle:$('#tToggle'),tPrev:$('#tPrev'),tNext:$('#tNext'),tClose:$('#tClose'),tProg:$('#tProg')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=sec=>Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');

/* ---------- Einstellungen + Speichern ---------- */
const LIMITS={round:{step:30,min:30,max:1800},pause:{step:15,min:0,max:600},rounds:{step:1,min:1,max:40}};
const cfg={round:300,pause:60,rounds:6,sound:true,speak:true,voice:''};
let roster=[];   // alle Mitglieder: {n: Name, here: anwesend?}
let people=[];   // nur die Anwesenden – daraus entstehen die Paarungen
const syncPeople=()=>{people=roster.filter(r=>r.here).map(r=>r.n)};
const KEY='sakura-v1';
const coll=new Intl.Collator('en',{sensitivity:'base'});
let view='setup';
function save(){try{localStorage.setItem(KEY,JSON.stringify({...cfg,roster}))}catch(e){}}
(function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||'null');
    if(d){['round','pause','rounds'].forEach(k=>{if(Number.isFinite(d[k]))cfg[k]=d[k]});cfg.sound=d.sound!==false;cfg.speak=d.speak!==false;cfg.voice=typeof d.voice==='string'?d.voice:'';
      if(Array.isArray(d.roster))roster=d.roster.filter(r=>r&&r.n).map(r=>({n:String(r.n),here:r.here!==false}));
      else if(Array.isArray(d.people))roster=d.people.map(n=>({n:String(n),here:true}));   // Übernahme der alten Liste
      return}
    const o=JSON.parse(localStorage.getItem('mattenzeit-v1')||'null');   // Übernahme aus der Vorversion
    if(o){cfg.round=(+o.rMin||0)*60+(+o.rSec||0)||300;cfg.pause=(+o.pMin||0)*60+(+o.pSec||0);cfg.rounds=+o.rounds||6;cfg.sound=o.sound!==false;
      roster=(Array.isArray(o.names)?o.names:String(o.names||'').split('\n')).map(s=>String(s).trim()).filter(Boolean).map(n=>({n,here:true}))}
  }catch(e){}
})();
el.sound.checked=cfg.sound;

function renderSettings(){
  const show={round:fmt(cfg.round),pause:cfg.pause?fmt(cfg.pause):'none',rounds:String(cfg.rounds)};
  for(const k in show){const i=$('#o-'+k);if(document.activeElement!==i)i.value=show[k]}
  document.querySelectorAll('.ctrl button').forEach(b=>{const L=LIMITS[b.dataset.k],v=cfg[b.dataset.k];b.disabled=b.dataset.d<0?v<=L.min:v>=L.max});
  const total=10+cfg.rounds*cfg.round+(cfg.rounds-1)*cfg.pause;
  const mins=Math.max(1,Math.round(total/60));
  el.total.textContent=view==='pairs'?`~${mins} min`:`${cfg.rounds} ${cfg.rounds===1?'round':'rounds'}, ~${mins} min`;
}
document.querySelectorAll('.ctrl button').forEach(b=>b.addEventListener('click',()=>{
  const k=b.dataset.k,L=LIMITS[k];cfg[k]=Math.min(L.max,Math.max(L.min,cfg[k]+L.step*(+b.dataset.d)));
  save();renderSettings();if(k==='rounds')rebuild();else updateInfo();
}));
el.sound.addEventListener('change',()=>{cfg.sound=el.sound.checked;save()});
const TTS='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
$('#speak').checked=cfg.speak;$('#speakRow').hidden=!TTS;   // Gerät ohne Sprachausgabe: Schalter ausblenden
$('#speak').addEventListener('change',()=>{cfg.speak=$('#speak').checked;save();if(!cfg.speak)hush();$('#voiceRow').hidden=!TTS||!cfg.speak});
$('#voiceRow').hidden=!TTS||!cfg.speak;

/* Werte antippen und eintippen.
   Zeit: "4:30" = 4 min 30 s. Ohne Doppelpunkt: bis 10 = Minuten, ab 11 = Sekunden
   ("5" = 5:00, "45" = 0:45, "90" = 1:30). Ungültiges wird verworfen. */
function parseTime(str){
  str=str.trim().toLowerCase();
  if(/^(none|off|-)$/.test(str))return 0;
  const m=str.match(/^(\d{1,3})\s*[:.,]\s*(\d{1,2})$/);
  if(m)return (+m[1])*60+(+m[2]);
  if(/^\d{1,4}$/.test(str)){const n=+str;return n<=10?n*60:n}
  return null;
}
function commitVal(k,inp){
  const t=inp.value.trim(),L=LIMITS[k];
  const v=k==='rounds'?(/^\d{1,3}$/.test(t)?+t:null):parseTime(t);
  if(v!==null){cfg[k]=Math.min(L.max,Math.max(L.min,v));save()}
  renderSettings();if(k==='rounds')rebuild();else updateInfo();
}
['round','pause','rounds'].forEach(k=>{
  const inp=$('#o-'+k);
  inp.addEventListener('focus',()=>{if(k==='pause'&&!cfg.pause)inp.value='';inp.select()});
  inp.addEventListener('blur',()=>commitVal(k,inp));
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();inp.blur()}
    else if(e.key==='Escape'){inp.value='';inp.blur()}
  });
});

/* ---------- Teilnehmer: feste Liste + Anwesenheit ----------
   Alle Mitglieder bleiben gespeichert. Vor dem Training tippt man nur an, wer da ist.
   Löschen geht nur im Bearbeiten-Modus. Warum: damit beim schnellen Antippen niemand aus Versehen verschwindet. */
let editing=false;
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function renderPeople(){
  syncPeople();
  el.chips.innerHTML='';
  const total=roster.length,here=people.length;
  el.count.textContent=total?`${here} of ${total} here`:'';
  $('#rtools').hidden=!total;
  $('#rhint').textContent=editing?'Tap × to delete a name for good.':'Tap names to mark who’s here.';
  const eb=$('#editRoster');eb.setAttribute('aria-pressed',String(editing));eb.textContent=editing?'Done':'Edit';
  $('#allHere').disabled=$('#noneHere').disabled=editing;
  if(!total){const li=document.createElement('li');li.className='none';li.textContent='No names saved yet.';el.chips.append(li);return}
  roster.slice().sort((x,y)=>coll.compare(x.n,y.n)).forEach(r=>{
    const li=document.createElement('li'),b=document.createElement('button');b.type='button';b.className='chip';
    if(editing){
      b.classList.add('editing');b.innerHTML=`<span>${esc(r.n)}</span><span class="x" aria-hidden="true">×</span>`;
      b.setAttribute('aria-label','Delete '+r.n);
      b.addEventListener('click',()=>{roster=roster.filter(x=>x!==r);peopleChanged()});
    }else{
      b.setAttribute('aria-pressed',String(r.here));
      b.innerHTML=(r.here?CHECK:'')+`<span>${esc(r.n)}</span>`;
      b.addEventListener('click',()=>{r.here=!r.here;peopleChanged()});
    }
    li.append(b);el.chips.append(li);
  });
}
function addPerson(){
  const n=el.nameIn.value.trim();
  if(!n){el.nameIn.focus();return}
  const ex=roster.find(r=>r.n.toLowerCase()===n.toLowerCase());
  if(ex){
    if(!ex.here){ex.here=true;el.nameIn.value='';el.msg.textContent=`${ex.n} was already on the list and is now marked as here.`;el.msg.classList.add('ok');peopleChanged()}
    else{el.msg.classList.remove('ok');el.msg.textContent=`“${n}” is already on the list. Try “${n} K.” to tell them apart.`;el.nameIn.select()}
    return;
  }
  roster.push({n,here:true});el.nameIn.value='';el.msg.textContent='';el.nameIn.focus();peopleChanged();
}
function peopleChanged(){renderPeople();save();rebuild()}
$('#allHere').addEventListener('click',()=>{roster.forEach(r=>r.here=true);peopleChanged()});
$('#noneHere').addEventListener('click',()=>{roster.forEach(r=>r.here=false);peopleChanged()});
$('#editRoster').addEventListener('click',()=>{editing=!editing;el.msg.textContent='';renderPeople()});
el.saveName.addEventListener('click',addPerson);
el.nameIn.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addPerson()}});
el.nameIn.addEventListener('input',()=>{el.msg.textContent=''});

/* Maximal mögliche Runden ohne Wiederholung: gerade n -> n-1, ungerade n -> n */
const uniqueRounds=n=>n<2?0:(n%2===0?n-1:n);
function updateInfo(){
  const n=people.length,u=uniqueRounds(n);
  if(n<2){el.info.innerHTML=roster.length>1?'<p class="hint">Mark at least two athletes as here to create pairings.</p>':'';return}
  let h=`<p class="hint">${n%2?'Odd number of athletes here: one sits out each round. ':''}Up to ${u} rounds without repeat pairings.</p>`;
  if(cfg.rounds>u)h+=`<p class="hint warn">From round ${u+1} on, pairings have to repeat. They are marked in the pairings.</p>`;
  el.info.innerHTML=h;
}

/* ---------- Paarungen (Circle Method) ----------
   Ein Platz bleibt fest, alle anderen rotieren pro Runde eine Position weiter.
   So trifft jeder jeden genau einmal pro Durchgang. Ungerade Anzahl:
   ein leerer Platz kommt dazu – wer ihm gegenübersteht, pausiert. */
function shuffleArr(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildSchedule(names,rounds){
  let line=shuffleArr(names);if(line.length%2)line.push(null);
  const m=line.length,per=m-1,seen=new Set(),out=[];
  for(let r=0;r<rounds;r++){
    const k=r%per;if(r>0&&k===0)line=shuffleArr(line);
    const rest=line.slice(1),rot=rest.slice(rest.length-k).concat(rest.slice(0,rest.length-k));
    const order=[line[0],...rot],pairs=[];let bye=null;
    for(let i=0;i<m/2;i++){const a=order[i],b=order[m-1-i];
      if(a===null||b===null){bye=a===null?b:a;continue}
      const key=[a,b].sort().join('\u0000');pairs.push({a,b,repeat:seen.has(key)});seen.add(key)}
    // Alphabetisch: innerhalb des Paars und die Paare untereinander. Warum: Man findet seinen Namen schneller.
    pairs.forEach(p=>{if(coll.compare(p.a,p.b)>0)[p.a,p.b]=[p.b,p.a]});
    pairs.sort((x,y)=>coll.compare(x.a,y.a));
    out.push({pairs,bye});
  }
  return out;
}
let schedule=[];
function rebuild(){
  updateInfo();
  if(people.length<2){schedule=[];el.planBody.innerHTML='';el.start.disabled=true;if(view==='pairs')setView('setup');return}
  schedule=buildSchedule(people,cfg.rounds);
  const n=people.length,u=uniqueRounds(n);
  el.pvSum.textContent=`${n} athletes, ${cfg.rounds} ${cfg.rounds===1?'round':'rounds'} of ${fmt(cfg.round)}, ${cfg.pause?fmt(cfg.pause)+' rest':'no rest'}. `+
    (cfg.rounds>u?`Pairings repeat from round ${u+1} on (marked).`:'No pairing repeats.');
  el.pvSum.classList.toggle('warn',cfg.rounds>u);
  renderPlan();
  el.start.disabled=false;
}
function renderPlan(){
  el.planBody.innerHTML='<div class="rounds">'+schedule.map((r,i)=>`<div class="round"><h3>Round ${i+1}</h3>`+
    r.pairs.concat(r.extra||[]).map(p=>`<div class="pair${p.repeat?' repeat':''}"><span>${esc(p.a)}</span><span class="vs">vs</span><span>${esc(p.b)}</span></div>`).join('')+
    (r.bye&&!byeJoined(r)?`<div class="bye">Sits out: ${esc(r.bye)}</div>`:'')+'</div>').join('')+'</div>';
}
const byeJoined=r=>!!(r.bye&&(r.extra||[]).some(p=>p.a===r.bye||p.b===r.bye));

/* ---------- Neu planen während des Trainings ----------
   Kommt jemand dazu oder geht, werden nur die noch kommenden Runden neu geplant.
   Die App merkt sich, wer schon gegeneinander gerollt ist (inkl. spontaner Einstiege),
   damit sich Paarungen weiter möglichst nicht wiederholen.
   Aussetzen reihum: Wer bisher am seltensten ausgesetzt hat, ist dran. */
const pkey=(a,b)=>a<b?a+'\u0000'+b:b+'\u0000'+a;
// Mehrere komplette Planungen der restlichen Runden, die mit den wenigsten Wiederholungen gewinnt.
// Warum: Runde für Runde "gierig" zu planen kann sich in eine Ecke manövrieren, in der später Wiederholungen nötig werden.
function replanFrom(from){
  let best=null;
  const tries=people.length<=16?150:40;   // kleine Gruppen: mehr Versuche, kostet kaum Zeit
  for(let t=0;t<tries;t++){const r=planOnce(from);if(!best||r.cost<best.cost)best=r;if(best.cost===0)break}
  best.rounds.forEach((r,k)=>{schedule[from+k]=r});
}
function planOnce(from){
  const hist=new Map(),sat=new Map();let lastBye=null,cost=0;const rounds=[];
  for(let i=0;i<from&&i<schedule.length;i++){
    const r=schedule[i];r.pairs.concat(r.extra||[]).forEach(p=>hist.set(pkey(p.a,p.b),(hist.get(pkey(p.a,p.b))||0)+1));
    if(r.bye){sat.set(r.bye,(sat.get(r.bye)||0)+1);lastBye=r.bye}
  }
  const H=(a,b)=>hist.get(pkey(a,b))||0;
  for(let i=from;i<schedule.length;i++){
    let list=shuffleArr(people),bye=null;
    if(list.length%2){
      const min=Math.min(...list.map(n=>sat.get(n)||0));
      let cand=list.filter(n=>(sat.get(n)||0)===min);
      if(cand.length>1&&lastBye)cand=cand.filter(n=>n!==lastBye);
      bye=cand[Math.floor(Math.random()*cand.length)];
      list=list.filter(n=>n!==bye);sat.set(bye,(sat.get(bye)||0)+1);lastBye=bye;
    }
    const pairs=bestMatching(list,H).map(([a,b])=>({a,b,repeat:H(a,b)>0}));
    pairs.forEach(p=>{cost+=H(p.a,p.b);hist.set(pkey(p.a,p.b),H(p.a,p.b)+1)});
    pairs.forEach(p=>{if(coll.compare(p.a,p.b)>0)[p.a,p.b]=[p.b,p.a]});
    pairs.sort((x,y)=>coll.compare(x.a,y.a));
    rounds.push({pairs,bye});
  }
  return {rounds,cost};
}
// Paarung mit möglichst wenig Wiederholungen: mehrere zufällige Versuche, jeweils durch Tauschen verbessert.
function bestMatching(list,H){
  if(list.length<2)return [];
  let best=null,bestCost=Infinity;
  for(let t=0;t<40&&bestCost>0;t++){
    const rest=shuffleArr(list),pairs=[];
    while(rest.length){const a=rest.shift();let bi=0,bc=Infinity;
      rest.forEach((b,j)=>{const c=H(a,b);if(c<bc){bc=c;bi=j}});pairs.push([a,rest.splice(bi,1)[0]])}
    let improved=true;
    while(improved){improved=false;
      for(let i=0;i<pairs.length;i++)for(let j=i+1;j<pairs.length;j++){
        const [a,b]=pairs[i],[c,d]=pairs[j],now=H(a,b)+H(c,d);
        if(H(a,c)+H(b,d)<now){pairs[i]=[a,c];pairs[j]=[b,d];improved=true}
        else if(H(a,d)+H(b,c)<now){pairs[i]=[a,d];pairs[j]=[b,c];improved=true}
      }}
    const cost=pairs.reduce((s,[a,b])=>s+H(a,b),0);
    if(cost<bestCost){bestCost=cost;best=pairs}
  }
  return best;
}
/* Spontaner Einstieg in die laufende Runde: Neue, Partner von Gegangenen und der Aussetzende
   werden als Angebot zusammengebracht. Die laufende Runde selbst bleibt unverändert. */
function jumpIns(r){
  const R=schedule[r];if(!R)return;
  const here=new Set(people);
  const valid=R.pairs.concat(R.extra||[]).filter(p=>here.has(p.a)&&here.has(p.b));
  const busy=new Set();valid.forEach(p=>{busy.add(p.a);busy.add(p.b)});
  const keep=(R.extra||[]).filter(p=>here.has(p.a)&&here.has(p.b));
  const pool=people.filter(n=>!busy.has(n));
  if(R.bye&&pool.includes(R.bye)){pool.splice(pool.indexOf(R.bye),1);pool.push(R.bye)}   // Aussetzender zuletzt: Neue zuerst untereinander
  for(let i=0;i+1<pool.length;i+=2)keep.push({a:pool[i],b:pool[i+1],jump:true});
  R.extra=keep;
  R.alone=pool.length%2&&pool[pool.length-1]!==R.bye?pool[pool.length-1]:null;   // übrig, z. B. Partner ist gegangen
}
el.shuffle.addEventListener('click',rebuild);

/* ---------- Ansichten: Einstellungen -> Paarungen -> Timer ----------
   Warum ein eigener Paarungs-Bildschirm: Man prüft den Plan in Ruhe, bevor es losgeht.
   Die Zurück-Geste des Handys führt von den Paarungen zurück zu den Einstellungen. */
function setView(v,push){
  view=v;
  el.setupView.hidden=v!=='setup';el.pairView.hidden=v!=='pairs';
  el.dockLabel.textContent=v==='pairs'?'Start session':'Create pairings';
  renderSettings();window.scrollTo(0,0);
  if(push)try{history.pushState({view:v},'')}catch(e){}
}
window.addEventListener('popstate',()=>{if(view==='pairs')setView('setup')});
el.pvBack.addEventListener('click',()=>{if(history.state&&history.state.view==='pairs')history.back();else setView('setup')});

let bellBuf=null,bellLoading=false;
function loadBell(){
  if(!ctx||bellBuf||bellLoading)return;bellLoading=true;
  try{const bin=atob(BELL_B64),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    const ok=b=>{bellBuf=b},fail=()=>{bellLoading=false};
    const pr=ctx.decodeAudioData(arr.buffer,ok,fail);if(pr&&pr.then)pr.then(ok).catch(fail)}catch(e){bellLoading=false}
}
function unlockAudio(){
  // iPhone: "playback" heißt, Ton auch bei Stummschalter. Ältere Geräte ignorieren das einfach.
  try{if(navigator.audioSession&&navigator.audioSession.type!=='playback')navigator.audioSession.type='playback'}catch(e){}
  try{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();loadBell()}catch(e){}}
function beep(f,d,w){if(!ctx||!cfg.sound)return;const t=ctx.currentTime+(w||0),o=ctx.createOscillator(),g=ctx.createGain();
  o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+d+.05)}
function gong(){ // Ersatz, falls die Glocke nicht dekodiert werden kann
  if(!ctx||!cfg.sound)return;const t=ctx.currentTime,base=164,master=ctx.createGain();master.connect(ctx.destination);
  master.gain.setValueAtTime(.0001,t);master.gain.exponentialRampToValueAtTime(.55,t+.008);master.gain.exponentialRampToValueAtTime(.0001,t+4);
  [[1,1,4],[1.006,.6,4],[2.02,.45,2.6],[2.76,.4,2.2],[4.07,.25,1.4],[5.43,.18,1]].forEach(([r,a,d])=>{const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.value=base*r;g.gain.setValueAtTime(a,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.05)});
}
function bell(){if(!ctx||!cfg.sound)return;if(!bellBuf){gong();return}
  const src=ctx.createBufferSource();src.buffer=bellBuf;src.connect(ctx.destination);src.start()}
/* ---------- Ansage der Paarungen ----------
   In jeder Pause liest das Handy vor, wer als Nächstes mit wem rollt (nicht im Countdown vor Runde 1).
   Start 1,5 s nach der Glocke, damit sich beides nicht überlagert. Beginnt die Runde, wird abgebrochen.
   Die Stimme ist die eingebaute Sprachausgabe des Handys: funktioniert offline. */
let speakTimer=null,speakTok=0,voices=[];
/* Stimmenwahl: Spaß- und Roboterstimmen des iPhones ausschließen, die natürlichsten bevorzugen.
   Warum: Sonst nimmt das Handy die erste englische Stimme, oft eine Effekt-Stimme wie "Albert". */
const NOVELTY=/^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Jester|Junior|Kathy|Organ|Pipe Organ|Princess|Ralph|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Hysterical|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley)\b/i;
const GOOD=/(Samantha|Ava|Allison|Susan|Zoe|Evan|Nathan|Tom|Alex|Daniel|Karen|Moira|Tessa|Serena|Kate|Oliver|Aria|Jenny|Guy|Google US English|Google UK English)/i;
function voiceScore(v){
  let sc=0;
  if(/premium|enhanced|natural|neural/i.test(v.name))sc+=100;
  if(GOOD.test(v.name))sc+=40;
  if(/^en[-_]US/i.test(v.lang))sc+=10;else if(/^en[-_]GB/i.test(v.lang))sc+=8;
  if(v.localService)sc+=5;   // funktioniert offline
  return sc;
}
function pickVoice(){
  if(!TTS)return;
  voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)&&!NOVELTY.test(v.name)).sort((x,y)=>voiceScore(y)-voiceScore(x));
  const sel=$('#voiceSel');if(!sel)return;
  sel.innerHTML='<option value="">Best available</option>'+voices.map(v=>`<option value="${esc(v.name)}">${esc(v.name.replace(/ \(.*\)$/,''))} (${esc(v.lang)})</option>`).join('');
  sel.value=voices.some(v=>v.name===cfg.voice)?cfg.voice:'';
}
const currentVoice=()=>voices.find(v=>v.name===cfg.voice)||voices[0]||null;
if(TTS){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){}}
$('#voiceSel').addEventListener('change',e=>{cfg.voice=e.target.value;save()});
/* Satz für Satz sprechen, mit kurzer Pause dazwischen. Warum: iPhone-Stimmen machen bei Punkten kaum Pausen. */
function speakLines(lines){
  const tok=++speakTok;let i=0;
  const next=()=>{
    if(tok!==speakTok||i>=lines.length)return;
    const [text,gap]=lines[i++];let moved=false;
    const go=()=>{if(moved)return;moved=true;setTimeout(next,gap)};
    try{
      const u=new SpeechSynthesisUtterance(text);u.lang='en-US';const v=currentVoice();if(v){u.voice=v;u.lang=v.lang}
      u.rate=.9;u.pitch=1;u.volume=1;u.onend=go;u.onerror=go;speechSynthesis.speak(u);
      setTimeout(go,1800+text.length*90);   // Sicherheitsnetz, falls das Handy das Ende nicht meldet
    }catch(e){go()}
  };
  next();
}
$('#voiceTest').addEventListener('click',()=>{unlockSpeech();hush();speakLines(announceLines(null))});
function unlockSpeech(){   // iPhone: Sprachausgabe muss einmal durch einen Tipp freigeschaltet werden
  if(!TTS||unlockSpeech.done)return;unlockSpeech.done=true;
  try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}
}
function hush(){clearTimeout(speakTimer);speakTok++;if(TTS)try{speechSynthesis.cancel()}catch(e){}}
/* Takt der Ansage: deutliche Pause nach "Round X", danach die Paarungen flüssig hintereinander.
   r = null liefert die Beispielansage für den Test-Knopf. */
const GAP_HEAD=1100,GAP_PAIR=150;
function announceLines(r,updated){
  const R=r==null?{pairs:[{a:'Anna',b:'Ben'},{a:'Can',b:'Dana'}],bye:'Ede'}:schedule[r];if(!R)return[];
  const lines=[];if(updated)lines.push(['Pairings updated.',500]);
  lines.push([`Round ${r==null?2:r+1}.`,GAP_HEAD]);
  R.pairs.forEach(p=>lines.push([`${p.a} with ${p.b}.`,GAP_PAIR]));
  if(R.bye)lines.push([`${R.bye} sits out.`,0]);
  return lines;
}
function announce(r,updated,delay){
  if(!TTS||!cfg.speak)return;hush();
  speakTimer=setTimeout(()=>{
    const ph=T.phases[T.i];if(!T.running||!ph||ph.type!=='pause')return;
    speakLines(announceLines(r,updated));
  },delay==null?1500:delay);
}
// Bei jedem Phasenwechsel: in der Pause ansagen, sonst Ansage beenden
function phaseSpeech(){const ph=T.phases[T.i];if(!T.done&&T.running&&ph&&ph.type==='pause')announce(ph.r);else hush()}
const flashEl=$('#flash');
function flash(n){flashEl.className='';void flashEl.offsetWidth;flashEl.className='go'+n}
const sfx={start:()=>{bell();flash(1)},warn:()=>{beep(700,.15);beep(700,.15,.25)},end:()=>{bell();flash(2)}};

/* ---------- Bildschirm wach halten ---------- */
let lock=null;
async function wake(on){try{if(on&&'wakeLock' in navigator&&!lock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>lock=null)}
  else if(!on&&lock){await lock.release();lock=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  if(ctx&&ctx.state!=='running')try{ctx.resume()}catch(e){}   // iPhone hält den Ton im Hintergrund an
  if(T.running){wake(true);tick()}
});

/* ---------- Timer ----------
   Ablauf: 10 s Countdown -> Runde -> Pause -> Runde ... -> Ende.
   Restzeit wird aus einer festen Endzeit berechnet statt heruntergezählt,
   weil setInterval ungenau läuft, sobald das Handy kurz die App wechselt. */
const PREP=10000;
const T={phases:[],i:0,remaining:0,endAt:0,running:false,warned:false,done:false,lastSec:null};
function setupTimer(){
  T.phases=[{type:'prep',r:0,dur:PREP}];
  schedule.forEach((_,i)=>{T.phases.push({type:'round',r:i,dur:cfg.round*1000});if(i<schedule.length-1&&cfg.pause>0)T.phases.push({type:'pause',r:i+1,dur:cfg.pause*1000})});
  T.i=0;T.remaining=PREP;T.running=false;T.warned=false;T.done=false;T.lastSec=null;
}
function goPhase(i){
  if(i>=T.phases.length){T.done=true;T.running=false;T.remaining=0;wake(false);render();return}
  T.i=Math.max(0,i);T.done=false;T.warned=false;T.lastSec=null;T.remaining=T.phases[T.i].dur;
  if(T.running){T.endAt=Date.now()+T.remaining;if(T.phases[T.i].type==='round')sfx.start()}
  render();phaseSpeech();
}
function tick(){
  if(!T.running)return;
  const ph=T.phases[T.i];T.remaining=T.endAt-Date.now();
  const sec=Math.ceil(T.remaining/1000);
  if(ph.type!=='round'&&sec<=3&&sec>=1&&sec!==T.lastSec){T.lastSec=sec;beep(660,.12)}
  if(ph.type==='round'&&!T.warned&&T.remaining<=10000&&ph.dur>15000){T.warned=true;sfx.warn();render()}
  if(T.remaining<=0){catchUp();return}
  renderClock();
}
/* Nachholen: Jede neue Phase beginnt genau am Ende der vorherigen, nicht erst "jetzt".
   Warum: War das Display aus oder die App im Hintergrund, läuft der Plan trotzdem pünktlich weiter.
   Es ertönt nur EIN Signal für den Stand, in dem man zurückkommt – kein Glocken-Gewitter.
   Pause 0: Runde folgt direkt auf Runde, dann nur die Startglocke statt End- und Startglocke gleichzeitig. */
function catchUp(){
  const now=Date.now();
  while(T.endAt<=now){
    if(T.i+1>=T.phases.length){T.done=true;T.running=false;T.remaining=0;wake(false);hush();sfx.end();render();return}
    T.i++;T.endAt+=T.phases[T.i].dur;
  }
  const ph=T.phases[T.i];
  T.remaining=T.endAt-now;T.lastSec=null;
  T.warned=ph.type==='round'&&T.remaining<=10000;   // verpasste 10-s-Warnung nicht nachträglich piepen
  if(ph.type==='round')sfx.start();else sfx.end();
  render();phaseSpeech();
}
function run(){T.running=true;T.endAt=Date.now()+T.remaining;wake(true)}
function toggle(){
  unlockAudio();
  if(T.done){setupTimer();run();render();return}
  if(T.running){T.remaining=T.endAt-Date.now();T.running=false;wake(false)}
  else{const fresh=T.remaining===T.phases[T.i].dur;run();if(fresh&&T.phases[T.i].type==='round')sfx.start()}
  render();
}
function pairsHTML(r,live){const s=schedule[r];if(!s)return'';
  if(!s.pairs.length&&!(s.extra||[]).length)return '<div class="tpin"><div class="tbye">Not enough athletes here for pairings.</div></div>';
  const extra=live?(s.extra||[]):[];
  const here=new Set(people),nm=n=>live&&!here.has(n)?`<span class="gone">${esc(n)}</span>`:`<span>${esc(n)}</span>`;   // Gegangene durchgestrichen
  return '<div class="tpin">'+s.pairs.map(p=>`<div class="tpair">${nm(p.a)}<span class="vs">vs</span>${nm(p.b)}</div>`).join('')+
    extra.map(p=>`<div class="tpair jump"><span>${esc(p.a)}</span><span class="vs">vs</span><span>${esc(p.b)}</span><span class="tag">Can jump in now</span></div>`).join('')+
    (s.bye&&!(live&&byeJoined(s))?`<div class="tbye">Sits out: ${esc(s.bye)}</div>`:'')+
    (live&&s.alone?`<div class="tbye">No partner this round: ${esc(s.alone)}</div>`:'')+'</div>'}
/* Einpassen: Stufe für Stufe kleiner, bis alle Paare sichtbar sind.
   In der Runde bleibt die Uhr immer groß, dort werden nur die Paare kompakter. */
// Pause/Countdown: Namen so groß wie möglich, die Uhr wird nur so weit kleiner wie nötig.
// Runde: Uhr bleibt groß. Nur wenn es gar nicht anders passt, eine Stufe kleiner.
const FIT_REST=[0,1,2,3].flatMap(p=>[0,1,2,3].map(c=>[c,p])),FIT_ROUND=[[0,0],[0,1],[0,2],[0,3],[1,3]];
function fit(){
  const ph=T.phases[T.i];
  const steps=(T.done||!ph)?[[0,0]]:(ph.type==='round'?FIT_ROUND:FIT_REST);
  for(const [c,p] of steps){
    el.timer.dataset.c=c;el.timer.dataset.p=p;
    if(el.tPairs.scrollHeight<=el.tPairs.clientHeight+1)break;
  }
}
window.addEventListener('resize',()=>{if(el.timer.classList.contains('on'))fit()});
function renderClock(){
  el.tClock.textContent=fmt(Math.max(0,Math.ceil(T.remaining/1000)));
  const ph=T.phases[T.i];el.tProg.style.width=T.done?'100%':(100*(1-T.remaining/ph.dur)).toFixed(2)+'%';
}
function render(){
  const ph=T.phases[T.i],total=schedule.length;
  const final=ph&&ph.type==='round'&&T.remaining<=10000&&ph.dur>15000;
  el.timer.className='on '+(T.done?'done':final?'final':ph.type);
  el.tPrev.disabled=T.i===0||T.done;el.tNext.disabled=T.done;
  if(T.done){el.tPhase.innerHTML='<span class="jp">それまで</span>Session complete';el.tClock.textContent='0:00';el.tSub.textContent='Good rolls.';el.tPairs.innerHTML='';el.tToggle.textContent='Restart';el.tProg.style.width='100%';el.timer.dataset.c=0;el.timer.dataset.p=0;return}
  const stop=T.running?'':' <small>paused</small>';
  if(ph.type==='prep'){el.tPhase.innerHTML='<span class="jp">礼</span>Get ready'+stop;el.tSub.textContent='Up next';el.tPairs.innerHTML=pairsHTML(0)}
  else if(ph.type==='round'){el.tPhase.innerHTML=`<span class="jp">始め</span>Round ${ph.r+1} <small>/ ${total}</small>`+stop;el.tSub.textContent='';el.tPairs.innerHTML=pairsHTML(ph.r,true)}
  else{el.tPhase.innerHTML='<span class="jp">待て</span>Rest'+stop;el.tSub.textContent=`Up next: round ${ph.r+1}`;el.tPairs.innerHTML=pairsHTML(ph.r)}
  el.tToggle.textContent=T.running?'Pause':'Resume';
  renderClock();fit();
}
el.start.addEventListener('click',()=>{if(!schedule.length)return;
  if(view==='setup'){setView('pairs',true);return}
  unlockAudio();unlockSpeech();setupTimer();run();render();el.tToggle.focus()});
el.tToggle.addEventListener('click',toggle);

/* ---------- "Who's here" während des Trainings ---------- */
let sheetDirty=false;
function renderSheet(){
  syncPeople();
  $('#sCount').textContent=`${people.length} of ${roster.length} here`;
  const ul=$('#sChips');ul.innerHTML='';
  roster.slice().sort((x,y)=>coll.compare(x.n,y.n)).forEach(r=>{
    const li=document.createElement('li'),b=document.createElement('button');b.type='button';b.className='chip';
    b.setAttribute('aria-pressed',String(r.here));b.innerHTML=(r.here?CHECK:'')+`<span>${esc(r.n)}</span>`;
    b.addEventListener('click',()=>{r.here=!r.here;sheetDirty=true;save();renderSheet()});
    li.append(b);ul.append(li);
  });
}
function sheetAdd(){
  const inp=$('#sNameIn'),msg=$('#sMsg'),n=inp.value.trim();
  if(!n){inp.focus();return}
  const ex=roster.find(r=>r.n.toLowerCase()===n.toLowerCase());
  if(ex&&ex.here){msg.classList.remove('ok');msg.textContent=`“${n}” is already here. Try “${n} K.” to tell them apart.`;inp.select();return}
  if(ex){ex.here=true;msg.textContent=`${ex.n} is now marked as here.`}else{roster.push({n,here:true});msg.textContent=`${n} added.`}
  msg.classList.add('ok');inp.value='';sheetDirty=true;save();renderSheet();
}
function openSheet(){sheetDirty=false;$('#sMsg').textContent='';$('#sNameIn').value='';renderSheet();$('#sheet').hidden=false;$('#sDone').focus()}
function closeSheet(){
  $('#sheet').hidden=true;renderPeople();updateInfo();
  if(!sheetDirty||T.done)return;
  const ph=T.phases[T.i];
  const from=ph.type==='prep'?0:ph.type==='pause'?ph.r:ph.r+1;   // ab der nächsten Runde
  if(ph.type==='round')jumpIns(ph.r);   // zuerst: spontane Einstiege zählen schon zur Historie
  replanFrom(from);
  renderPlan();render();
  if(ph.type==='pause'&&T.running)announce(ph.r,true,300);
  hint(from<schedule.length?`Pairings updated from round ${from+1}`:'No rounds left to update');
}
$('#tPeople').addEventListener('click',openSheet);
$('#sDone').addEventListener('click',closeSheet);
$('#sheetBg').addEventListener('click',closeSheet);
$('#sSave').addEventListener('click',sheetAdd);
$('#sNameIn').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sheetAdd()}});
el.timer.addEventListener('pointerdown',()=>{if(ctx&&ctx.state!=='running')unlockAudio()});
/* Vor/Zurück nur durch Gedrückthalten (0,6 s). Warum: Ein versehentlicher Tipp mit
   verschwitzten Fingern soll keine Runde überspringen. Kurzer Tipp zeigt nur einen Hinweis. */
let hintTimer=null;
function hint(t){const h=$('#tHint');h.textContent=t;h.classList.add('show');clearTimeout(hintTimer);hintTimer=setTimeout(()=>h.classList.remove('show'),1600)}
function holdButton(btn,action,label){
  let t=null;
  const cancel=()=>{if(t){clearTimeout(t);t=null;btn.classList.remove('holding');hint(label)}};
  btn.addEventListener('pointerdown',e=>{if(btn.disabled)return;e.preventDefault();unlockAudio();btn.classList.add('holding');
    t=setTimeout(()=>{t=null;btn.classList.remove('holding');if(navigator.vibrate)try{navigator.vibrate(30)}catch(e){}action()},600)});
  btn.addEventListener('pointerup',cancel);btn.addEventListener('pointerleave',cancel);btn.addEventListener('pointercancel',cancel);
  btn.addEventListener('contextmenu',e=>e.preventDefault());
  btn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action()}});   // Tastatur: sofort
}
holdButton(el.tNext,()=>goPhase(T.i+1),'Hold to skip ahead');
holdButton(el.tPrev,()=>goPhase(T.i-1),'Hold to go back');
el.tClose.addEventListener('click',()=>{if(T.running&&!confirm('The session is still running. Go back to the plan?'))return;T.running=false;wake(false);hush();el.timer.className=''});
document.addEventListener('keydown',e=>{if(!el.timer.classList.contains('on')||!$('#sheet').hidden)return;
  if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key==='ArrowRight'&&!T.done)goPhase(T.i+1);else if(e.key==='ArrowLeft'&&T.i>0&&!T.done)goPhase(T.i-1)});
setInterval(tick,200);

renderSettings();renderPeople();rebuild();
})();
</script>
